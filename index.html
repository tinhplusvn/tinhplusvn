<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh Sách Thiếu Niên Nhi Đồng Bản Sấm</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SheetJS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- ExcelJS & FileSaver -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <style>
      .app-header {
        background-color: #3f51b5;
        color: #ffffff;
        padding: 16px;
        text-align: center;
      }
      .header-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      .header-logo {
        width: 60px;
        height: 60px;
        margin-bottom: 8px;
        border-radius: 50%;
        object-fit: cover;
      }
      .header-title {
        font-size: 15px;
        font-weight: bold;
        margin: 0;
        text-transform: uppercase;
      }
      .header-subtitle {
        font-size: 14px;
        font-weight: bold;
        margin: 4px 0;
        text-transform: uppercase;
      }
      .header-desc {
        font-size: 13px;
        opacity: 0.95;
        margin: 2px 0 0 0;
        font-weight: 600;
        text-transform: uppercase;
      }
    </style>
</head>
<body class="bg-[#f7f6f0] min-h-screen pb-24 font-sans relative">

  <!-- Header Navigation -->
  <header class="app-header">
    <div class="header-content">
      <img src="logo.png" alt="Logo Đoàn" class="header-logo" onerror="this.style.display='none'">
      <h1 class="header-title">ĐOÀN TNCS HỒ CHÍ MINH</h1>
      <h2 class="header-subtitle">CHI ĐOÀN BẢN SẤM</h2>
      <p class="header-desc">DANH SÁCH THIẾU NIÊN NHI ĐỒNG BẢN SẤM</p>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-3 sm:px-6 pt-4">

      <!-- Thống kê nhanh -->
      <div class="grid grid-cols-2 sm:grid-cols-5 gap-2.5 mb-4">
          <div class="bg-white p-2.5 rounded-2xl shadow-sm border border-slate-200/80 text-center">
              <span class="text-[11px] text-slate-500 font-medium">Tổng số</span>
              <p id="stat-total" class="text-lg font-bold text-slate-800">0</p>
          </div>
          <div class="bg-white p-2.5 rounded-2xl shadow-sm border border-slate-200/80 text-center">
              <span class="text-[11px] text-amber-600 font-medium">Mẫu Giáo (3 - 5)</span>
              <p id="stat-mg" class="text-lg font-bold text-amber-600">0</p>
          </div>
          <div class="bg-white p-2.5 rounded-2xl shadow-sm border border-slate-200/80 text-center">
              <span class="text-[11px] text-emerald-600 font-medium">Tiểu Học (6 - 10)</span>
              <p id="stat-th" class="text-lg font-bold text-emerald-600">0</p>
          </div>
          <div class="bg-white p-2.5 rounded-2xl shadow-sm border border-slate-200/80 text-center">
              <span class="text-[11px] text-blue-600 font-medium">THCS (11 - 15)</span>
              <p id="stat-thcs" class="text-lg font-bold text-blue-600">0</p>
          </div>
          <div class="bg-white p-2.5 rounded-2xl shadow-sm border border-slate-200/80 text-center col-span-2 sm:col-span-1">
              <span class="text-[11px] text-slate-600 font-medium">Khác</span>
              <p id="stat-other" class="text-lg font-bold text-slate-600">0</p>
          </div>
      </div>

      <!-- Thanh công cụ -->
      <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200/80 mb-4 space-y-3">
          <div class="grid grid-cols-1 sm:grid-cols-4 gap-2.5">
              <!-- Ô tìm kiếm -->
              <div class="relative sm:col-span-1">
                  <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400"></i>
                  <input type="text" id="searchInput" oninput="renderTable()" placeholder="Tìm tên, phụ huynh, SĐT..." 
                         class="w-full pl-9 pr-3 py-2 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
              </div>

              <!-- Lọc Giới tính -->
              <div>
                  <select id="filterGender" onchange="renderTable()" class="w-full py-2 px-3 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                      <option value="">-- Tất cả giới tính --</option>
                      <option value="Nam">Nam</option>
                      <option value="Nữ">Nữ</option>
                  </select>
              </div>

              <!-- Lọc Khối học -->
              <div>
                  <select id="filterBlock" onchange="renderTable()" class="w-full py-2 px-3 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                      <option value="">-- Tất cả khối học --</option>
                      <option value="MG">Khối Mẫu Giáo (3 - 5 tuổi)</option>
                      <option value="TH">Khối Tiểu Học (6 - 10 tuổi)</option>
                      <option value="THCS">Khối THCS (11 - 15 tuổi)</option>
                      <option value="KHAC">Khác</option>
                  </select>
              </div>

              <!-- Lọc Địa chỉ -->
              <div>
                  <select id="filterAddress" onchange="renderTable()" class="w-full py-2 px-3 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                      <option value="">-- Tất cả thôn / địa chỉ --</option>
                      <option value="Thôn Sấm 1">Thôn Sấm 1</option>
                      <option value="Thôn Sấm 2">Thôn Sấm 2</option>
                      <option value="Thôn Sấm 3">Thôn Sấm 3</option>
                      <option value="Thôn Bãi Cả">Thôn Bãi Cả</option>
                  </select>
              </div>
          </div>

          <div class="flex flex-wrap gap-2 pt-2 border-t border-slate-100 justify-between items-center">
              <div class="flex flex-wrap gap-2">
                  <label class="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-medium px-3 py-1.5 rounded-xl text-xs cursor-pointer flex items-center gap-1 border border-indigo-200 transition">
                      <i class="fa-solid fa-file-import"></i> Nhập từ Excel
                      <input type="file" id="excelFileInput" accept=".xlsx, .xls" onchange="importExcel(event)" class="hidden">
                  </label>
                  <button onclick="exportExcel()" class="bg-emerald-50 hover:bg-emerald-100 text-emerald-700 font-medium px-3 py-1.5 rounded-xl text-xs flex items-center gap-1 border border-emerald-200 transition">
                      <i class="fa-solid fa-file-excel"></i> Xuất Excel mẫu
                  </button>
              </div>
              <button onclick="clearAllData()" class="text-rose-600 hover:text-rose-800 text-xs font-medium px-2 py-1 flex items-center gap-1">
                  <i class="fa-solid fa-trash"></i> Xóa tất cả
              </button>
          </div>
      </div>

      <!-- Danh sách dạng CARD UI -->
      <div id="studentCardContainer" class="space-y-3.5">
          <!-- Render Javascript -->
      </div>

      <div id="emptyMessage" class="hidden p-8 text-center text-slate-400 bg-white rounded-2xl shadow-sm border border-slate-200/80">
          <i class="fa-solid fa-inbox text-4xl mb-2"></i>
          <p>Chưa có dữ liệu học sinh nào.</p>
      </div>
  </main>

  <!-- NÚT CUỘN LÊN ĐẦU TRANG -->
  <button id="scrollToTopBtn" 
          onclick="scrollToTop()" 
          title="Cuộn lên đầu trang" 
          class="fixed bottom-24 right-6 w-12 h-12 bg-slate-800/80 hover:bg-slate-800 active:scale-95 text-white rounded-full shadow-md flex items-center justify-center text-lg z-40 opacity-0 pointer-events-none transition-all duration-300">
      <i class="fa-solid fa-arrow-up"></i>
  </button>

  <!-- NÚT THÊM MỚI NỔI BẬT BÊN PHẢI (FAB) -->
  <button onclick="openModal()" 
          title="Thêm mới" 
          class="fixed bottom-6 right-6 w-14 h-14 bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white rounded-full shadow-lg hover:shadow-xl flex items-center justify-center text-2xl z-40 transition-all duration-200">
      <i class="fa-solid fa-plus"></i>
  </button>

  <!-- Modal Form -->
  <div id="studentModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-3">
      <div class="bg-white rounded-2xl shadow-xl w-full max-w-lg overflow-hidden max-h-[90vh] flex flex-col">
          <div class="bg-indigo-700 text-white px-5 py-3 flex justify-between items-center">
              <h3 id="modalTitle" class="font-bold text-base">Thêm Mới Thiếu Niên Nhi Đồng</h3>
              <button onclick="closeModal()" class="text-indigo-200 hover:text-white text-xl"><i class="fa-solid fa-xmark"></i></button>
          </div>
          <form id="studentForm" onsubmit="saveStudent(event)" class="p-5 overflow-y-auto space-y-4 text-sm">
              <input type="hidden" id="studentId">

              <div>
                  <label class="block font-medium text-slate-700 mb-1">Họ và tên <span class="text-red-500">*</span></label>
                  <input type="text" id="fullName" required class="w-full px-3 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none">
              </div>

              <div class="grid grid-cols-2 gap-3">
                  <div>
                      <label class="block font-medium text-slate-700 mb-1">Ngày sinh <span class="text-red-500">*</span></label>
                      <input type="date" id="birthDate" required class="w-full px-3 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                  </div>
                  <div>
                      <label class="block font-medium text-slate-700 mb-1">Giới tính</label>
                      <select id="gender" class="w-full px-3 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                          <option value="Nam">Nam</option>
                          <option value="Nữ">Nữ</option>
                      </select>
                  </div>
              </div>

              <div class="grid grid-cols-2 gap-3">
                  <div>
                      <label class="block font-medium text-slate-700 mb-1">Địa chỉ</label>
                      <select id="address" class="w-full px-3 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                          <option value="Thôn Sấm 1">Thôn Sấm 1</option>
                          <option value="Thôn Sấm 2">Thôn Sấm 2</option>
                          <option value="Thôn Sấm 3">Thôn Sấm 3</option>
                          <option value="Thôn Bãi Cả">Thôn Bãi Cả</option>
                      </select>
                  </div>
                  <div>
                      <label class="block font-medium text-slate-700 mb-1">Lớp học</label>
                      <input type="text" id="className" placeholder="Ví dụ: 1A, 6B, Mẫu giáo..." class="w-full px-3 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                  </div>
              </div>

              <div class="grid grid-cols-2 gap-3">
                  <div>
                      <label class="block font-medium text-slate-700 mb-1">Họ tên Bố</label>
                      <input type="text" id="fatherName" class="w-full px-3 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                  </div>
                  <div>
                      <label class="block font-medium text-slate-700 mb-1">Họ tên Mẹ</label>
                      <input type="text" id="motherName" class="w-full px-3 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                  </div>
              </div>

              <div>
                  <label class="block font-medium text-slate-700 mb-1">SĐT PH</label>
                  <input type="tel" id="parentPhone" placeholder="037..." class="w-full px-3 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none">
              </div>

              <div class="flex justify-end gap-2 pt-3 border-t border-slate-100">
                  <button type="button" onclick="closeModal()" class="px-4 py-2 border border-slate-300 rounded-xl text-slate-600 hover:bg-slate-50 font-medium">Hủy</button>
                  <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded-xl hover:bg-indigo-700 font-medium shadow">Lưu lại</button>
              </div>
          </form>
      </div>
  </div>

  <script>
      let students = JSON.parse(localStorage.getItem('TNND_BANSAM_DATA')) || [];

      document.addEventListener('DOMContentLoaded', () => {
          renderTable();

          const topBtn = document.getElementById('scrollToTopBtn');
          window.addEventListener('scroll', () => {
              if (window.scrollY > 200) {
                  topBtn.classList.remove('opacity-0', 'pointer-events-none');
                  topBtn.classList.add('opacity-100');
              } else {
                  topBtn.classList.remove('opacity-100');
                  topBtn.classList.add('opacity-0', 'pointer-events-none');
              }
          });
      });

      function scrollToTop() {
          window.scrollTo({
              top: 0,
              behavior: 'smooth'
          });
      }

      function calculateAge(birthDateStr) {
          if (!birthDateStr) return 0;
          const parts = birthDateStr.split('-');
          if (parts.length < 1) return 0;
          const birthYear = parseInt(parts[0], 10);
          if (isNaN(birthYear)) return 0;
          const currentYear = new Date().getFullYear();
          const age = currentYear - birthYear;
          return age < 0 ? 0 : age;
      }

      function getSchoolBlock(age, className) {
          const cls = (className || '').toUpperCase().trim();

          if (/^(6|7|8|9)/.test(cls)) return { name: "THCS", code: "THCS", bg: "bg-[#38629b] text-white" };
          if (/^(1|2|3|4|5)/.test(cls)) return { name: "Tiểu Học", code: "TH", bg: "bg-[#2b8a3e] text-white" };
          if (/mẫu giáo|mầm non|mg|mn/i.test(cls)) return { name: "Mẫu Giáo", code: "MG", bg: "bg-[#e67e22] text-white" };

          if (age >= 11 && age <= 15) return { name: "THCS", code: "THCS", bg: "bg-[#38629b] text-white" };
          if (age >= 6 && age <= 10) return { name: "Tiểu Học", code: "TH", bg: "bg-[#2b8a3e] text-white" };
          if (age >= 3 && age <= 5) return { name: "Mẫu Giáo", code: "MG", bg: "bg-[#e67e22] text-white" };

          return { name: "Khác", code: "KHAC", bg: "bg-slate-600 text-white" };
      }

      function formatDateDisplay(dateStr) {
          if (!dateStr) return '';
          const parts = dateStr.split('-');
          if (parts.length === 3) return `${parts[2].padStart(2, '0')}/${parts[1].padStart(2, '0')}/${parts[0]}`;
          return dateStr;
      }

      function getFilteredStudents() {
          const searchVal = document.getElementById('searchInput').value.toLowerCase().trim();
          const filterGenderVal = document.getElementById('filterGender').value;
          const filterBlockVal = document.getElementById('filterBlock').value;
          const filterAddressVal = document.getElementById('filterAddress').value;

          let filtered = students.filter(s => {
              const age = calculateAge(s.birthDate);
              const blockInfo = getSchoolBlock(age, s.className);
              const matchSearch = (s.fullName || '').toLowerCase().includes(searchVal) ||
                                  (s.fatherName || '').toLowerCase().includes(searchVal) ||
                                  (s.motherName || '').toLowerCase().includes(searchVal) ||
                                  (s.parentPhone || '').includes(searchVal);
              const matchGender = !filterGenderVal || (s.gender || 'Nam').toLowerCase() === filterGenderVal.toLowerCase();
              const matchBlock = !filterBlockVal || blockInfo.code === filterBlockVal;
              const matchAddress = !filterAddressVal || (s.address || '').toLowerCase() === filterAddressVal.toLowerCase();

              return matchSearch && matchGender && matchBlock && matchAddress;
          });

          filtered.sort((a, b) => {
              const dateA = a.birthDate || '9999-12-31';
              const dateB = b.birthDate || '9999-12-31';
              return dateA.localeCompare(dateB);
          });

          return filtered;
      }

      function renderTable() {
          const container = document.getElementById('studentCardContainer');
          const emptyMsg = document.getElementById('emptyMessage');
          
          container.innerHTML = '';

          const filtered = getFilteredStudents();

          updateStats(filtered);

          if (filtered.length === 0) {
              emptyMsg.classList.remove('hidden');
              return;
          } else {
              emptyMsg.classList.add('hidden');
          }

          filtered.forEach((item, index) => {
              const age = calculateAge(item.birthDate);
              const block = getSchoolBlock(age, item.className);
              
              const card = document.createElement('div');
              card.className = "bg-white p-4 rounded-3xl border border-slate-200/70 shadow-sm relative text-slate-700";

              card.innerHTML = `
                  <div class="flex items-start gap-3">
                      <!-- STT Badge -->
                      <div class="w-10 h-10 rounded-2xl bg-[#f2ebd9] flex items-center justify-center font-bold text-slate-800 text-lg flex-shrink-0">
                          ${index + 1}
                      </div>

                      <!-- Thông tin chính -->
                      <div class="flex-1 min-w-0">
                          <div class="flex justify-between items-start gap-2">
                              <h3 class="text-xl font-bold text-slate-900 leading-snug truncate">${item.fullName || ''}</h3>
                              <span class="px-3 py-1 text-xs font-medium rounded-full ${block.bg} flex-shrink-0">
                                  ${block.name}
                              </span>
                          </div>

                          <div class="text-slate-500 text-sm mt-1 flex flex-wrap gap-x-2 items-center">
                              <span>${item.gender || 'Nam'}</span>
                              <span>•</span>
                              <span>${age} tuổi</span>
                              <span>•</span>
                              <span>${formatDateDisplay(item.birthDate)}</span>
                              ${item.className ? `<span>•</span><span>Lớp ${item.className}</span>` : ''}
                          </div>

                          <!-- Bố - Mẹ -->
                          <div class="grid grid-cols-1 sm:grid-cols-2 gap-x-4 gap-y-1 mt-3 text-slate-800 text-sm">
                              <div><span class="text-slate-500">Bố:</span> ${item.fatherName || '-'}</div>
                              <div><span class="text-slate-500">Mẹ:</span> ${item.motherName || '-'}</div>
                          </div>

                          <!-- SĐT - Địa chỉ -->
                          <div class="flex flex-wrap items-center gap-x-6 gap-y-1 mt-2.5 text-sm text-slate-600">
